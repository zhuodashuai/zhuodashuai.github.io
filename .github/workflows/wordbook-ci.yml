name: Wordbook CI

on:
  pull_request:
    paths:
      - "vocab/**"
      - "wordbook-api/**"
      - "tooling/tests/**"
      - "tooling/scripts/**"
      - "tooling/lib/**"
      - "tooling/dictionary/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tooling/playwright.config.mjs"
      - ".github/workflows/wordbook-ci.yml"
      - ".github/scripts/**"
      - "_config.yml"
  push:
    branches: [main, "codex/**"]
    paths:
      - "vocab/**"
      - "wordbook-api/**"
      - "tooling/tests/**"
      - "tooling/scripts/**"
      - "tooling/lib/**"
      - "tooling/dictionary/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tooling/playwright.config.mjs"
      - ".github/workflows/wordbook-ci.yml"
      - ".github/scripts/**"
      - "_config.yml"

permissions:
  contents: read

jobs:
  # This is a real Pages build and package measurement, not a projection or
  # deployment. Keep runtime and rollback resources; developer evidence stays in Git.
  pages-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
          verbose: false
      - name: Verify all published static bytes before packaging
        run: node .github/scripts/check-pages-package.mjs --site=_site
      - name: Measure the actual GNU Pages archive
        run: |
          tar --dereference --hard-dereference --directory _site -cf "$RUNNER_TEMP/pages-preflight.tar" --exclude=.git --exclude=.github .
          node .github/scripts/check-pages-package.mjs --site=_site --tar="$RUNNER_TEMP/pages-preflight.tar"

  verify:
    runs-on: ubuntu-latest
    # The full Chrome regression now takes about 15-16 minutes on hosted
    # runners, in addition to builds and Worker tests. Installing Chrome can
    # itself take over 9 minutes on a cold runner. Leave setup/cleanup margin;
    # individual test deadlines, zero retries and every assertion stay intact.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build compact member lookup from existing public data
        run: |
          node tooling/scripts/build-dictionary-pos.mjs --check
          node tooling/scripts/build-member-dictionary.mjs
          node tooling/scripts/build-expanded-dictionary.mjs
          node tooling/scripts/build-expanded-dictionary.mjs --check
          node tooling/scripts/build-chinese-search-ranking.mjs --check
          node tooling/scripts/build-dictionary-suggestions.mjs
          node tooling/scripts/build-dictionary-suggestions.mjs --check
          node tooling/scripts/build-dictionary-examples.mjs --check
          node tooling/scripts/build-dictionary-examples-additive.mjs --check
          node tooling/scripts/build-canonical-example-repairs.mjs --check
          node tooling/scripts/build-common-synonyms.mjs --check
      - name: Secret boundary scan
        run: pnpm test:security
      - name: Unit and Worker integration tests
        run: pnpm test
      - name: Original headword seed tests
        run: |
          python3 -m unittest discover -s tooling/tests -p test_seed_original_headwords.py -v
          python3 -m unittest discover -s tooling/tests -p test_prepare_expanded_dictionary.py -v
      - name: TypeScript check
        run: pnpm --dir wordbook-api check
      - name: Cloudflare Worker dry run
        run: pnpm --dir wordbook-api exec wrangler deploy --dry-run
      - name: Install stable Chrome for browser regression
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "Using the runner's installed stable Chrome; keeping every browser test and zero retries."
          else
            pnpm exec playwright install --with-deps chrome
          fi
          google-chrome --version
      - name: Desktop, mobile, offline and PWA E2E
        run: pnpm test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The Worker serves vocab/ through its ASSETS binding, so owner.html and the
  # whole app at the workers.dev origin only change when the Worker is
  # redeployed. Merging to main alone updates GitHub Pages and nothing else,
  # which is how a merged change can stay invisible on the admin page.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, pages-package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check for a Cloudflare token
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Worker not deployed::Set the CLOUDFLARE_API_TOKEN repository secret to deploy the Worker automatically. Until then, run 'pnpm --dir wordbook-api exec wrangler deploy' by hand after merging."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.configured == 'true'
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.configured == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        if: steps.guard.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile
      # Deploy leaves previously configured Worker secrets in place; it only
      # republishes the code, the vars in wrangler.jsonc and the vocab/ assets.
      - name: Deploy Worker and vocab assets
        if: steps.guard.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node tooling/scripts/build-dictionary-pos.mjs --check
          node tooling/scripts/build-member-dictionary.mjs
          node tooling/scripts/build-expanded-dictionary.mjs
          node tooling/scripts/build-dictionary-suggestions.mjs
          node tooling/scripts/build-dictionary-examples.mjs --check
          node tooling/scripts/build-dictionary-examples-additive.mjs --check
          node tooling/scripts/build-canonical-example-repairs.mjs --check
          pnpm --dir wordbook-api exec wrangler deploy
      - name: Confirm the deployed Worker is healthy
        if: steps.guard.outputs.configured == 'true'
        run: |
          set -euo pipefail
          url="https://zhuo-wordbook-api.zhuo-wordbook-api.workers.dev/api/v1/health"
          for attempt in 1 2 3 4 5; do
            if body=$(curl -fsS --max-time 20 "$url"); then
              echo "$body"
              node -e 'const b=JSON.parse(process.argv[1]); if(!b.ok) throw new Error("health ok:false"); console.log("version", b.version);' "$body"
              exit 0
            fi
            echo "health check attempt $attempt failed; retrying"
            sleep 5
          done
          echo "::error title=Health check failed::The Worker deployed but /api/v1/health did not respond ok."
          exit 1
